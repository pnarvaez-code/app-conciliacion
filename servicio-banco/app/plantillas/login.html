<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso - {{ servicio }}</title>
<link rel="stylesheet" href="/estaticos/estilos.css?v=20261114-1">
</head>
<body class="centrado">
<form class="tarjeta login-panel" method="post" action="/login">
  <div class="login-marca"><div><small>PLATAFORMA FINANCIERA</small><h1>{{ servicio }}</h1></div></div>
  <p class="tenue">Control de extractos, movimientos y sellos verificables.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label>Correo</label>
  <input type="email" name="email" required autofocus>
  <label>Clave</label>
  <input type="password" name="clave" required>
  <button type="submit">Ingresar al sistema</button>
  <p class="login-pie">Acceso protegido · Sesión auditada</p>
</form>
</body>
</html>
