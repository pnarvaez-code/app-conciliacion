# Complemento para usar la plataforma en local: agrega los puertos
# publicados en la maquina para poder entrar desde el navegador.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# En un servidor con Coolify no se usa: ahi el proxy entra por la red interna
# del compose. El conciliador queda en 8080 para no chocar con el panel de
# Coolify, que usa el 8000.

services:
  pyme:
    ports:
      - "${PUERTO_PYME_LOCAL:-8001}:8001"

  banco:
    ports:
      - "${PUERTO_BANCO_LOCAL:-8002}:8002"

  conciliador:
    ports:
      - "${PUERTO_CONCILIADOR_LOCAL:-8080}:8000"
