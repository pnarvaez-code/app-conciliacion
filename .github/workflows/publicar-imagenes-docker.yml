name: Publicar imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: pyme
            contexto: servicio-pyme
          - nombre: banco
            contexto: servicio-banco
          - nombre: conciliador
            contexto: servicio-conciliador
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-conciliacion-${{ matrix.nombre }}:latest
            ghcr.io/${{ github.repository_owner }}/app-conciliacion-${{ matrix.nombre }}:${{ github.sha }}
